<!doctype html>
<html lang="zh-Hans"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow">
<title>学问卡交互原型</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@500;700&display=swap">
<style>
/* Layout: one centred card shaped like the device screen; black and white like the e-ink product */
:root{--paper:#fff;--ink:#111;--line:#111;--soft:#666;--err:#b3261e;--f-ui:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#141414;--ink:#f2f2f2;--line:#f2f2f2;--soft:#a8a8a8;--err:#ff8a80;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#141414;--ink:#f2f2f2;--line:#f2f2f2;--soft:#a8a8a8;--err:#ff8a80;color-scheme:dark}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-ui);display:grid;place-items:center;padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.gate{width:min(100%,360px);aspect-ratio:480/800;max-height:calc(100% - 8px);border:2px solid var(--line);border-radius:28px;display:flex;flex-direction:column;justify-content:center;gap:20px;padding:32px 28px;box-sizing:border-box}
h1{margin:0;font-size:28px;font-weight:700;line-height:1.3;text-wrap:balance}
p{margin:0;font-size:15px;line-height:1.6;color:var(--soft)}
form{display:flex;flex-direction:column;gap:12px;margin-top:8px}
label{font-size:14px;font-weight:500;letter-spacing:.04em}
input{font:500 17px var(--f-ui);padding:12px 14px;border:2px solid var(--line);border-radius:12px;background:var(--paper);color:var(--ink);min-width:0}
input:focus-visible,button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
button{font:700 17px var(--f-ui);padding:12px 14px;border:2px solid var(--line);border-radius:12px;background:var(--ink);color:var(--paper);cursor:pointer}
button[disabled]{opacity:.6;cursor:wait}
.msg{min-height:22px;font-size:14px;color:var(--err)}
</style>
</head><body>
<main class="gate">
  <h1>学问卡交互原型</h1>
  <p>按键版设备 demo，输入访问密码后打开。</p>
  <form id="f" autocomplete="off">
    <label for="pw">访问密码</label>
    <input id="pw" type="password" required autofocus>
    <button id="go" type="submit">打开 demo</button>
    <div class="msg" id="msg" role="alert"></div>
  </form>
</main>

const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open(pw){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(PAYLOAD.s),iterations:310000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  const html=new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(PAYLOAD.i)},key,b64(PAYLOAD.c)));
  document.open();document.write(html);document.close();
}
document.getElementById('f').addEventListener('submit',async e=>{
  e.preventDefault();const btn=document.getElementById('go'),msg=document.getElementById('msg');
  btn.disabled=true;btn.textContent='正在打开…';msg.textContent='';
  try{await open(document.getElementById('pw').value)}
  catch(err){btn.disabled=false;btn.textContent='打开 demo';msg.textContent='密码不对，请再试一次';}
});
